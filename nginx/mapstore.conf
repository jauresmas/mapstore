server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 100m;

    # On garde le port (localhost:8097) pour que MapStore et GeoServer génèrent les bonnes URL
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;

    location = /          { return 302 /mapstore/; }
    location = /mapstore  { return 301 /mapstore/; }
    location = /geoserver { return 301 /geoserver/; }

    location /mapstore/ {
        proxy_pass http://mapstore:8080/mapstore/;
    }

    # GeoServer dédié de la pile (conteneur mapstore-geoserver), branché sur PostGIS.
    # Même origine que MapStore : le navigateur l'interroge directement, sans CORS
    # ni passage par le proxy interne de MapStore.
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
    }

    # Pages statiques de l'installation (mentions, confidentialité), liées depuis l'avis de MapStore
    location /pages/ {
        alias /usr/share/nginx/pages/;
        charset utf-8;
    }
}
